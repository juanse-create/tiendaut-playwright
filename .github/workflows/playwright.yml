name: Pruebas Playwright TiendaUT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Actualizar capturas visuales
        env:
          HOME: /root
        run: npx playwright test tests/red-y-visual.spec.ts --grep "la página de inicio se ve igual" --update-snapshots

      - name: Guardar capturas actualizadas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-ubuntu
          path: tests/red-y-visual.spec.ts-snapshots/
          retention-days: 7

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
